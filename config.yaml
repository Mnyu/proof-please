factCheckJobQueue:
  name: fact-check
  requestsWindowInSeconds: 3600 # 1 hour
  maxRequestsPerUser: 5
  jobName: fact-check-job
  concurrency: 1
  retryAttempts: 1
  backOffType: exponential
  backOffDelayMilliseconds: 5000

video:
  maxDuration: 60 # seconds

extractor:
  baseurl: http://127.0.0.1:1234/v1
  provider: lmstudio
  model: qwen/qwen3.6-35b-a3b
  maxClaimedFacts: 4

verifier:
  baseurl: http://127.0.0.1:1234/v1
  provider: lmstudio
  model: qwen/qwen3.6-35b-a3b

googleFactCheck:
  pageSize: 3
  maxResults: 3

snopesFactCheck:
  pageSize: 3
  maxResults: 3

newsApi:
  pageSize: 3
  maxResults: 3
  sortBy: relevancy

newsDataIo:
  pageSize: 3
  maxResults: 3
  sortBy: relevancy

webSearch:
  pageSize: 5
  maxResults: 5
